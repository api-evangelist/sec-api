  baseURL: https://api.sec-api.io
  properties:
  - url: https://sec-api.io/docs/sec-filings-item-extraction-api
    type: APIReference
  - url: openapi/sec-api-openapi.yml
    type: OpenAPI
  description: Extracts individual textual sections (items) from 10-K, 10-Q, and 8-K
