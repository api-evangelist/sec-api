  humanURL: https://sec-api.io/docs/form-13-f-filings-institutional-holdings-api
  baseURL: https://api.sec-api.io
  properties:
  - url: https://sec-api.io/docs/form-13-f-filings-institutional-holdings-api
    type: APIReference
  - url: openapi/sec-api-openapi.yml
    type: OpenAPI
  description: Quarterly portfolio holdings of institutional investment managers
    disclosed in Form 13F filings, exposed as two endpoints - holdings information
    tables (CUSIP, ticker, shares, value per position) and cover pages - both
    searchable with Lucene queries over accession number, manager, and filing date.
