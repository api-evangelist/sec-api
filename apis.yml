    clean plain text or lightly formatted HTML for a given filing URL and item
    identifier.
- aid: sec-api:sec-api-insider-trading-api
  name: SEC API Insider Trading API
  tags:
  - Insider Trading
  - Regulatory Filings
  - Financial Data
  - Compliance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sec-api.io/docs/insider-ownership-trading-api
  baseURL: https://api.sec-api.io
  properties:
  - url: https://sec-api.io/docs/insider-ownership-trading-api
    type: APIReference
  - url: openapi/sec-api-openapi.yml
    type: OpenAPI
  description: Structured, queryable insider transaction data parsed from SEC Form
    3, 4, and 5 filings - issuer, reporting owner and relationship, non-derivative
