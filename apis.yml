apis:
- aid: sec-api:sec-api-filing-query-api
  name: SEC API Filing Query API
  tags:
  - SEC Filings
  - EDGAR
  - Regulatory Filings
  - Filing Search
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sec-api.io/docs/query-api
  baseURL: https://api.sec-api.io
  properties:
  - url: https://sec-api.io/docs
    type: Documentation
  - url: https://sec-api.io/docs/query-api
    type: APIReference
  - url: openapi/sec-api-openapi.yml
    type: OpenAPI
  description: Search and filter 18+ million EDGAR filings (1993-present) across
    400+ form types using Lucene syntax over filing metadata - form type, ticker,
    CIK, company name, filing date, and more. POST a query to receive matching
    filing metadata with document URLs, entities, and data files.
- aid: sec-api:sec-api-full-text-search-api
  name: SEC API Full-Text Search API
  tags:
  - Full-Text Search
  - Regulatory Filings
  - Government Reports
  - EDGAR
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sec-api.io/docs/full-text-search-api
  baseURL: https://api.sec-api.io
  properties:
  - url: https://sec-api.io/docs/full-text-search-api
    type: APIReference
  - url: openapi/sec-api-openapi.yml
    type: OpenAPI
  description: Keyword and phrase search across the full text of all EDGAR filings
    and their exhibits published since 2001, with wildcard and Boolean operators,
    form-type and CIK filters, and date-range scoping. Returns filing metadata and
    document URLs for every matching document.
- aid: sec-api:sec-api-filing-stream-api
  name: SEC API Filing Stream API
  tags:
  - Real-Time
  - Streaming
  - WebSocket
  - EDGAR
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sec-api.io/docs/stream-api
  baseURL: wss://stream.sec-api.io
  properties:
  - url: https://sec-api.io/docs/stream-api
    type: Documentation
  - url: asyncapi/sec-api-asyncapi.yml
    type: AsyncAPI
  description: Real-time, push-based WebSocket feed of newly published SEC EDGAR
    filings. Connect to wss://stream.sec-api.io with an API key and receive a
    stringified JSON array of filing metadata objects the moment each new filing is
    released, typically within 300 milliseconds of publication.
- aid: sec-api:sec-api-xbrl-to-json-api
  name: SEC API XBRL-to-JSON Converter API
  tags:
  - XBRL
  - Financial Data
  - Financial Statements
  - Regulatory Filings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sec-api.io/docs/xbrl-to-json-converter-api
  baseURL: https://api.sec-api.io
  properties:
  - url: https://sec-api.io/docs/xbrl-to-json-converter-api
    type: APIReference
  - url: openapi/sec-api-openapi.yml
