aid: sec-api
url: https://raw.githubusercontent.com/api-evangelist/sec-api/refs/heads/main/apis.yml
name: SEC API
kind: company
description: SEC API (sec-api.io) is a commercial developer platform that turns the
  U.S. Securities and Exchange Commission's EDGAR system into a fast, queryable REST
  and real-time streaming API. It covers 18+ million filings back to 1993 across
  400+ EDGAR form types, with a Lucene-based Filing Query API, a Full-Text Search
  API over filing bodies and exhibits since 2001, an XBRL-to-JSON financial statement
  converter, a section Extractor for 10-K/10-Q/8-K, and structured datasets for
  insider trading (Form 3/4/5), institutional holdings (Form 13F), 13D/13G, Form D,
  Form ADV, IPOs, and more. A real-time Filing Stream API pushes newly published
  filings to clients over a WebSocket connection as soon as they hit EDGAR. Access
  is via a single API token passed as an Authorization header or a token query
  parameter.
