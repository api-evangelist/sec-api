description: >-
  FinOps view of SEC API (sec-api.io) spend. SEC API is a flat-rate subscription
  SaaS: predictable monthly (or discounted annual) fees per tier, rather than
  pure per-call metering. The dominant cost drivers are the chosen plan
  (Personal & Startups at $55/month, Business Internal Use at $239/month, or a
  custom Enterprise contract) and staying within each plan's per-second request
  limits and monthly free data-download allowance (50 GB Personal, 100 GB
  Business). Overuse pressures an upgrade to a higher tier or Enterprise terms
  rather than incurring granular per-call overage. The underlying SEC EDGAR data
  is free and public; the fee buys the query, full-text, XBRL, dataset, and
  real-time streaming layer.
notes: >-
  Per-unit overage rates and exact data-download overage handling are not fully
  published; verify on the sec-api.io pricing page. Redistribution of the data
  requires an Enterprise license.
sources:
