openapi: 3.0.3
info:
  title: SEC API (sec-api.io) REST API
  description: >-
    REST surface of SEC API (sec-api.io), a commercial developer platform that
    turns the U.S. SEC EDGAR system into fast, queryable APIs. Covers 18+ million
    filings back to 1993 across 400+ form types. This document models the core
    REST endpoints - Filing Query, Full-Text Search, XBRL-to-JSON, Extractor,
    Insider Trading (Form 3/4/5), and Form 13F institutional holdings. The
    real-time Filing Stream API is a WebSocket surface and is modeled separately
    in asyncapi/sec-api-asyncapi.yml.

    Authentication is a single API token, obtained from your sec-api.io account.
    Pass it either as an `Authorization: YOUR_API_KEY` header or as a
    `?token=YOUR_API_KEY` query parameter. Endpoints, request shapes, and
    parameters were grounded against the live sec-api.io documentation on
    2026-07-11.
  version: '1.0'
  contact:
    name: SEC API
    url: https://sec-api.io
  license:
    name: API documentation - SEC API Terms of Service
    url: https://sec-api.io/terms-of-service
servers:
  - url: https://api.sec-api.io
    description: SEC API REST base
security:
  - apiKeyHeader: []
  - apiKeyQuery: []
tags:
  - name: Filing Query
    description: Search 18M+ EDGAR filings by metadata using Lucene syntax.
  - name: Full-Text Search
    description: Keyword and phrase search over filing bodies and exhibits since 2001.
  - name: XBRL
    description: Convert XBRL financial data in filings to standardized JSON.
  - name: Extractor
    description: Extract textual sections (items) from 10-K, 10-Q, and 8-K filings.
  - name: Insider Trading
    description: Structured insider transactions from Form 3, 4, and 5.
  - name: Form 13F
    description: Institutional investment manager holdings and cover pages.
paths:
  /:
    post:
      operationId: queryFilings
      tags:
        - Filing Query
      summary: Search EDGAR filings by metadata
      description: >-
        Search and filter EDGAR filings (1993-present) across 400+ form types
        using a Lucene query over filing metadata (formType, ticker, cik,
        companyName, filedAt, and more). Returns matching filing metadata with
        document URLs, entities, and data files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              query: 'formType:"10-Q"'
              from: '0'
              size: '50'
              sort:
                - filedAt:
                    order: desc
      responses:
        '200':
          description: Matching filings with metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingQueryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /full-text-search:
    post:
      operationId: fullTextSearch
      tags:
        - Full-Text Search
      summary: Full-text search across filings and exhibits
      description: >-
        Keyword and phrase search across the full text of all EDGAR filings and
        their exhibits published since 2001. Supports wildcards, Boolean
        operators, exact phrases, form-type and CIK filters, and a date range.
        Returns 100 results per page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullTextSearchRequest'
            example:
              query: '"climate change"'
              formTypes:
                - '8-K'
                - '10-K'
              startDate: '2024-01-01'
              endDate: '2024-12-31'
              page: '1'
      responses:
        '200':
          description: Matching filing documents with metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullTextSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /xbrl-to-json:
    get:
      operationId: xbrlToJson
      tags:
        - XBRL
      summary: Convert filing XBRL to JSON
      description: >-
        Parse the XBRL financial data embedded in a filing into standardized
        JSON (income statement, balance sheet, cash flow, cover page, and custom
        items). Supply exactly one of htm-url, xbrl-url, or accession-no.
      parameters:
        - name: htm-url
          in: query
          required: false
          description: URL of the filing's primary document, ending in .htm or .html.
          schema:
            type: string
        - name: xbrl-url
          in: query
          required: false
          description: Direct URL of the filing's XBRL instance file, ending in .xml.
          schema:
            type: string
        - name: accession-no
          in: query
          required: false
          description: Filing accession number, e.g. 0001564590-21-004599.
          schema:
            type: string
      responses:
        '200':
          description: XBRL financial data as JSON, organized by statement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /extractor:
    get:
      operationId: extractFilingSection
      tags:
        - Extractor
      summary: Extract a section (item) from a 10-K, 10-Q, or 8-K
      description: >-
        Extract a single textual section from a 10-K, 10-Q, or 8-K filing - for
        example 10-K Item 1A (Risk Factors) or Item 7 (MD&A) - returning clean
        plain text or lightly formatted HTML.
      parameters:
        - name: url
          in: query
          required: true
          description: Full URL of the filing document on SEC EDGAR.
          schema:
            type: string
        - name: item
          in: query
          required: true
          description: >-
            Section identifier. 10-K items include 1, 1A, 1B, 1C, 2, 3, 4, 5, 6,
            7, 7A, 8, 9, 9A, 9B, 10-15. 10-Q items include part1item1..part2item6.
            8-K items include 1-1..9-1 and signature.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - text
              - html
            default: text
        - name: token
          in: query
          required: false
          description: API key (alternative to the Authorization header).
          schema:
            type: string
      responses:
        '200':
          description: Extracted section content.
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /insider-trading:
    post:
      operationId: queryInsiderTrading
      tags:
        - Insider Trading
      summary: Query insider transactions (Form 3/4/5)
      description: >-
        Search structured insider transaction data parsed from SEC Form 3, 4,
        and 5 filings using Lucene syntax over any field. Returns issuer,
        reporting owner and relationship, non-derivative and derivative
        transactions, prices, share counts, post-transaction holdings, and
        footnotes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              query: 'issuer.tradingSymbol:TSLA'
              from: '0'
              size: '50'
              sort:
                - filedAt:
                    order: desc
      responses:
        '200':
          description: Matching insider transactions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /form-13f/holdings:
    post:
      operationId: query13FHoldings
      tags:
        - Form 13F
      summary: Query Form 13F holdings information tables
      description: >-
        Search quarterly portfolio holdings of institutional investment managers
        from Form 13F filings using Lucene syntax. Returns the holdings
        information table for each matching filing - CUSIP, ticker, number of
        shares, and dollar value per position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              query: 'accessionNo:"0001067983-23-000012"'
              from: '0'
              size: '50'
      responses:
        '200':
          description: Matching 13F filings with holdings arrays.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /form-13f/cover-pages:
    post:
      operationId: query13FCoverPages
      tags:
        - Form 13F
      summary: Query Form 13F cover pages
      description: >-
        Search Form 13F cover-page metadata (manager, report period, filing
        details) using Lucene syntax over any field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              query: 'filedAt:[2024-01-01 TO 2024-03-31]'
              from: '0'
              size: '50'
      responses:
        '200':
          description: Matching 13F cover pages.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        API key passed directly in the Authorization header (no `Bearer`
        prefix), e.g. `Authorization: YOUR_API_KEY`.
    apiKeyQuery:
      type: apiKey
      in: query
      name: token
      description: API key passed as the `token` query parameter.
  responses:
    Unauthorized:
      description: Missing or invalid API token.
    RateLimited:
      description: Rate limit exceeded for your plan.
  schemas:
    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: >-
            Search criteria in Lucene syntax following the field:value format.
            Maximum 3500 characters.
        from:
          type: string
          description: Zero-based start position for pagination. Default 0, max 10000.
          default: '0'
        size:
          type: string
          description: Number of results per request. Default 50, max 50.
          default: '50'
        sort:
          type: array
          description: Sort configuration. Defaults to filedAt descending.
          items:
            type: object
            additionalProperties: true
    FullTextSearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Search term(s), supporting wildcards, Boolean operators, and exact phrases.
        formTypes:
          type: array
          description: Optional list of EDGAR form types to filter on.
          items:
            type: string
        startDate:
          type: string
          description: Start of the date range, yyyy-mm-dd.
        endDate:
          type: string
          description: End of the date range, yyyy-mm-dd.
        ciks:
          type: array
          description: Optional list of CIKs to target.
          items:
            type: string
        page:
          type: string
          description: Page number for pagination. 100 results per page. Default 1.
          default: '1'
    FilingQueryResponse:
      type: object
      properties:
        total:
          type: object
          properties:
            value:
              type: integer
            relation:
              type: string
        filings:
          type: array
          items:
            $ref: '#/components/schemas/Filing'
    FullTextSearchResponse:
      type: object
      properties:
        total:
          type: object
          properties:
            value:
              type: integer
            relation:
              type: string
        filings:
          type: array
          items:
            $ref: '#/components/schemas/Filing'
    Filing:
      type: object
      properties:
        id:
          type: string
        accessionNo:
          type: string
        formType:
          type: string
        filedAt:
          type: string
          format: date-time
        cik:
          type: string
        ticker:
          type: string
        companyName:
          type: string
        entities:
          type: array
          items:
            type: object
            additionalProperties: true
        documentFormatFiles:
          type: array
          items:
            type: object
            additionalProperties: true
        dataFiles:
          type: array
          items:
            type: object
            additionalProperties: true
